name: Validate read-only Irina image pipeline
on:
  push:
    paths:
      - 'scripts/prepare_source.sh'
      - 'scripts/bake_image.sh'
      - 'scripts/bake_image_secureboot.sh'
      - '.github/workflows/build-secureboot-img.yml'
      - 'scripts/prepare_installed_source.sh'
      - 'scripts/bake_image_installed_secureboot.sh'
      - 'scripts/irina_grow_usb_root.sh'
      - 'scripts/irina_auto_provision.sh'
      - 'ui/irina_setup_status.py'
      - 'hardware/acer_swift3_sf314-41.json'
      - '.github/workflows/build-installed-secureboot-img.yml'
      - 'tests/test_installed_image.py'
      - 'windows/Irina-USB-Assistant.ps1'
      - 'windows/Start-Irina-USB-Assistant.cmd'
      - 'scripts/flash_irina.py'
      - 'scripts/check_wsl_loop.sh'
      - 'scripts/build_in_wsl.sh'
      - 'tests/test_readonly_pipeline.py'
      - 'scripts/prepare_installed_source.sh'
      - 'scripts/bake_image_installed_secureboot.sh'
      - 'scripts/irina_grow_usb_root.sh'
      - 'scripts/irina_auto_provision.sh'
      - 'ui/irina_setup_status.py'
      - 'hardware/acer_swift3_sf314-41.json'
      - '.github/workflows/build-installed-secureboot-img.yml'
      - 'tests/test_installed_image.py'
      - 'windows/Prepare-IrinaBuilderOnF.ps1'
      - 'windows/Build-IrinaViaWSL.ps1'
      - 'windows/Build-IrinaViaWSL-v2.ps1'
      - 'windows/Diagnose-IrinaWSL.ps1'
      - 'ai/hrag.py'
      - '.github/workflows/check-readonly-build.yml'
  pull_request:
    paths:
      - 'scripts/prepare_source.sh'
      - 'scripts/bake_image.sh'
      - 'scripts/bake_image_secureboot.sh'
      - '.github/workflows/build-secureboot-img.yml'
      - 'scripts/flash_irina.py'
      - 'ai/hrag.py'
jobs:
  syntax-and-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bash and Python syntax
        run: |
          bash -n scripts/prepare_source.sh
          bash -n scripts/bake_image.sh
          bash -n scripts/bake_image_secureboot.sh
          bash -n scripts/prepare_installed_source.sh
          bash -n scripts/bake_image_installed_secureboot.sh
          bash -n scripts/irina_grow_usb_root.sh
          bash -n scripts/irina_auto_provision.sh
          bash -n scripts/check_wsl_loop.sh
          bash -n scripts/build_in_wsl.sh
          python -m py_compile scripts/flash_irina.py ai/hrag.py ui/irina_setup_status.py
      - name: Check portable SHA256 and Windows WSL script dependencies
        run: |
          python3 -m unittest discover -s tests -p 'test_readonly_pipeline.py' -v
          python3 -m unittest discover -s tests -p 'test_installed_image.py' -v
      - name: Help commands do not write images
        run: |
          bash scripts/prepare_source.sh --help
          bash scripts/bake_image.sh --help
          bash scripts/build_in_wsl.sh --help
          python scripts/flash_irina.py --help
      - name: Check PowerShell source syntax without execution
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @('windows/Prepare-IrinaBuilderOnF.ps1', 'windows/Build-IrinaViaWSL.ps1', 'windows/Build-IrinaViaWSL-v2.ps1', 'windows/Diagnose-IrinaWSL.ps1', 'windows/Irina-USB-Assistant.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $file"
          }
      - name: Ensure WSL2 launcher avoids corrupted bash -lc quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s = Path("windows/Build-IrinaViaWSL.ps1").read_text(encoding="utf-8")
          assert "--exec /bin/bash $linuxFile" in s, "Must run path-based Bash script"
          assert "-- bash -lc $preflight" not in s
          assert "-- bash -lc $commands" not in s
          assert "[System.IO.File]::WriteAllText" in s
          for variable in ("preflight", "commands"):
              found = re.search(r"\$"+variable+r"=@'\n(.*?)\n'@", s, re.S)
              assert found, f"Missing {variable} here-string"
              snippet = found.group(1).replace("__PROFILE__", "core").replace("__MAX__", "5120")
              p = subprocess.run(["bash", "-n"], input=snippet, capture_output=True, text=True)
              assert p.returncode == 0, f"{variable} bash syntax failure: {p.stderr}"
          latest = Path("windows/Build-IrinaViaWSL-v2.ps1").read_text(encoding="utf-8")
          assert 'IRINA WSL BUILDER v2.3' in latest
          assert '--exec /bin/bash $linuxFile | Out-Host' in latest
          assert '--exec /bin/bash $linuxFile' in latest
          assert 'CHECK-ONLY PASS.' in latest
          assert '-- bash -lc $preflight' not in latest
          assert '-- bash -lc $commands' not in latest
          print("WSL PowerShell-to-Bash transfer: verified both embedded scripts and v2")
          PY
      - name: Regress stdout-vs-exit-code in PowerShell native command
        shell: pwsh
        run: |
          function Call-Test {
            & bash -c 'echo "WSL stdout failure description"; exit 5' | Out-Host
            $exitCode = [int]$LASTEXITCODE
            return $exitCode
          }
          $code = Call-Test
          if ($code -isnot [int] -or $code -ne 5) {
            throw "Native process stdout corrupted numeric exit status: '$code'"
          }
          Write-Host "PASS: native command output never replaces exit status"
          # PowerShell exits with the final native failure status even when our
          # assertion passes; reset only the CI test shell's native exit code.
          & bash -c 'exit 0'
      - name: Refuse building without privileges
        run: |
          ! bash scripts/prepare_source.sh --stage /tmp/irina-do-not-create
          test ! -e /tmp/irina-do-not-create
          ! bash scripts/bake_image.sh --stage /tmp/not-existing --output /tmp/irina-do-not-create.img
          test ! -e /tmp/irina-do-not-create.img
      - name: Check image hash verifier on fake data (no disk writing)
        run: |
          python - <<'PY'
          import hashlib, tempfile, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import flash_irina
          with tempfile.TemporaryDirectory() as directory:
              img=Path(directory)/"test.img"
              img.write_bytes(b"not-a-bootable-image")
              digest=hashlib.sha256(img.read_bytes()).hexdigest()
              Path(str(img)+".sha256").write_text(digest+"  test.img\n")
              assert flash_irina.verify_checksum(img)==digest
              img.write_bytes(b"corrupted")
              try: flash_irina.verify_checksum(img)
              except RuntimeError: pass
              else: raise AssertionError("Hash mismatch was not detected")
          PY
