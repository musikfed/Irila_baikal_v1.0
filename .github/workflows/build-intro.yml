name: Build Irina Baikal intro audio

on:
  push:
    paths:
      - 'audio/generate_intro.py'
      - '.github/workflows/build-intro.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak ffmpeg
          python -m pip install numpy scipy
      - name: Generate original music + synthetic voice
        run: |
          python audio/generate_intro.py --output /tmp/irina_intro.wav
          mkdir -p ui/web/assets
          ffmpeg -hide_banner -loglevel error -y -i /tmp/irina_intro.wav -codec:a libmp3lame -qscale:a 3 ui/web/assets/irina_intro.mp3
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 ui/web/assets/irina_intro.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: irina-baikal-intro-mp3
          path: ui/web/assets/irina_intro.mp3
      - name: Commit generated MP3 to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/web/assets/irina_intro.mp3
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish generated Irina Baikal startup audio"
            for attempt in 1 2 3; do
              git fetch --quiet origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            echo 'Could not fast-forward audio asset onto main' >&2
            exit 1
          fi
