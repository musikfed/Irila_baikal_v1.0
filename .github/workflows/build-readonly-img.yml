name: Build Irina Baikal read-only IMG

# Real build on GitHub cloud runner; local Windows WSL is optional.
# On main, rebuild only when the image pipeline/workflow changes. Also supports manual Run workflow.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-readonly-img.yml'
      - 'scripts/prepare_source.sh'
      - 'scripts/bake_image.sh'
      - 'scripts/check_wsl_loop.sh'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Core is most likely to fit 5 GiB; full includes office, graphics, mail and SIP'
        required: true
        default: core
        type: choice
        options:
          - core
          - full
      max_mib:
        description: 'Maximum raw image size in MiB (5120=5 GiB; full may need 8192)'
        required: true
        default: '5120'
        type: choice
        options:
          - '5120'
          - '8192'

permissions:
  contents: read

concurrency:
  group: irina-img-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMG_PROFILE: ${{ inputs.profile || 'core' }}
      IMG_MAX_MIB: ${{ inputs.max_mib || '5120' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check available disk space
        run: |
          df -h /
          free -h
          echo "This job ONLY builds a file image; it never accesses the Acer SSD."
          echo "Profile: $IMG_PROFILE; IMG size cap: $IMG_MAX_MIB MiB"
      - name: Install Linux image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap ubuntu-keyring rsync squashfs-tools \
            parted gdisk dosfstools e2fsprogs util-linux udev mount \
            grub-efi-amd64-bin grub-common python3
      - name: Check loop/GPT support on a temporary image before heavy build
        run: |
          sudo bash scripts/check_wsl_loop.sh
          df -h /
      - name: Prepare Ubuntu 24.04 stage with casper
        run: |
          sudo bash scripts/prepare_source.sh --stage /srv/irina/rootfs "--$IMG_PROFILE"
          df -h /
      - name: Bake compact GPT EFI SquashFS image
        run: |
          sudo bash scripts/bake_image.sh --stage /srv/irina/rootfs \
            --output /srv/irina/irina_baikal_1.0.img \
            --max-image-mib "$IMG_MAX_MIB"
          cd /srv/irina
          sha256sum -c irina_baikal_1.0.img.sha256
          ls -lh irina_baikal_1.0.img irina_baikal_1.0.img.sha256
      - name: Remove build rootfs to free artifact staging space
        if: success()
        run: |
          sudo rm -rf /srv/irina/rootfs
          df -h /
      - name: Prepare downloadable files
        run: |
          # The image was created by root in /srv/irina. GNU mv tries to
          # unlink the root-owned source directory and fails as 'runner'.
          # Copy readable files instead, then verify the COPIED IMG.
          sudo chmod 644 /srv/irina/irina_baikal_1.0.img /srv/irina/irina_baikal_1.0.img.sha256
          mkdir -p output
          cp -- /srv/irina/irina_baikal_1.0.img output/
          cp -- /srv/irina/irina_baikal_1.0.img.sha256 output/
          ( cd output && sha256sum -c irina_baikal_1.0.img.sha256 )
          ls -lh output/irina_baikal_1.0.img output/irina_baikal_1.0.img.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: irina-baikal-1.0-readonly-img
          path: output/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
